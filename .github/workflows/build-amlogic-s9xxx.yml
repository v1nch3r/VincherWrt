name: Build Amlogic s9xxx

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/v1nch3r/amlogic-openwrt.git
  PROC_LISTS: s905x3_s905x2_s905x_s905w_s905d_s922x_s912_s905_s905l2_s905l3_s905l3a_s905l3b
  KERNEL_VR: 6.6.50_6.1.118
  KERNEL_REPO: v1nch3r/kernel
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.owner.id }} == ${{ github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@main
        
      - name: Get OpenWrt Version
        id: version
        run: |
          VERSION=$(cat openwrt-version.txt)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_TAG=VincherWrt-$VERSION-$(date +"%Y.%m.%d")" >> $GITHUB_OUTPUT

      - name: Clean disk
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -hT $PWD
        
      - name: Install dependencies
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install pigz zstd
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* snapd* 2>/dev/null || true
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          df -hT $PWD
        
      - name: Cache OpenWrt ImageBuilder
        uses: actions/cache@v4
        with:
          path: |
            openwrt/
            ~/cache/
          key: openwrt-armvirt-${{ steps.version.outputs.VERSION }}
          restore-keys: |
            openwrt-armvirt-

      - name: Cloning Source
        run: |
          df -hT $PWD
          git clone --depth 1 $REPO_URL

      - name: Building
        if: steps.cache-imagebuilder.outputs.cache-hit != 'true'
        run: |
          sudo chmod +x targets/armvirt64.sh
          sudo ./targets/armvirt64.sh
          sudo timedatectl set-timezone "${TZ}"

      - name: Set PACKAGED_STATUS
        run: |
          if [ -d "openwrt/bin/targets" ] || [ -d "amlogic-openwrt/openwrt-armvirt" ]; then
            echo "PACKAGED_STATUS=success" >> $GITHUB_ENV
          else
            echo "PACKAGED_STATUS=failed" >> $GITHUB_ENV
          fi
          echo "Build status: $PACKAGED_STATUS"
     
      - name: Repacking
        if: env.PACKAGED_STATUS == 'success'
        run: |
          chmod +x amlogic-openwrt/make
          cd amlogic-openwrt/ && sudo ./make -b $PROC_LISTS -k $KERNEL_VR -r $KERNEL_REPO -a false
 
      - name: Upload OpenWrt Firmware to Release
        if: env.PACKAGED_STATUS == 'success'
        uses: ncipollo/release-action@main
        with:
          tag: ${{ steps.version.outputs.BUILD_TAG }}
          artifacts: "amlogic-openwrt/openwrt/out/*.img.gz,amlogic-openwrt/openwrt-armvirt/*.tar.gz"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: release_body.txt
