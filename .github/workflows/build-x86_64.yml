name: Build x86_64

on:
  workflow_dispatch:

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.owner.id }} == ${{ github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@main
        
      - name: Get OpenWrt Version
        id: version
        run: |
          VERSION=$(cat openwrt-version.txt)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_TAG=VincherWrt-$VERSION-$(date +"%Y.%m.%d")" >> $GITHUB_OUTPUT
        
      - name: Clean disk
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -hT $PWD
        
      - name: Install dependencies
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install qemu-utils mkisofs zstd
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* snapd* 2>/dev/null || true
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          df -hT $PWD

      - name: Cache OpenWrt ImageBuilder
        id: cache-imagebuilder
        uses: actions/cache@v4
        with:
          path: |
            openwrt/
            ~/cache/
          key: openwrt-x86_64-${{ steps.version.outputs.VERSION }}
          restore-keys: |
            openwrt-x86_64-

      - name: Building
        if: steps.cache-imagebuilder.outputs.cache-hit != 'true'
        run: |
          sudo chmod +x targets/x86_64.sh
          sudo ./targets/x86_64.sh
          sudo timedatectl set-timezone "${TZ}"

      - name: Set PACKAGED_STATUS
        run: |
          if [ -d "openwrt/bin/targets/x86/64" ]; then
            echo "PACKAGED_STATUS=success" >> $GITHUB_ENV
          else
            echo "PACKAGED_STATUS=failed" >> $GITHUB_ENV
          fi
          echo "Build status: $PACKAGED_STATUS"
          ls -la openwrt/bin/targets/x86/64/ 2>/dev/null || echo "No output directory found"
 
      - name: Upload OpenWrt Firmware to Release
        if: env.PACKAGED_STATUS == 'success'
        uses: ncipollo/release-action@main
        with:
          tag: ${{ steps.version.outputs.BUILD_TAG }}
          artifacts: "openwrt/bin/targets/x86/64/*ext4-combined*,openwrt/bin/targets/x86/64/*squashfs-combined*"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: release_body.txt
