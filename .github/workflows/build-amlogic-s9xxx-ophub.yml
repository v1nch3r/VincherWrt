name: Build Amlogic s9xxx ophub

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/v1nch3r/amlogic-openwrt.git
  PROC_LISTS: s905x
  KERNEL_VR: 6.6.128
  KERNEL_REPO: ophub/kernel
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.owner.id }} == ${{ github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@main
        
      - name: Initialization environment
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null
          sudo -E apt-get -y update
          sudo -E apt-get -y install pigz zstd
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
        
      - name: Cloning Source
        run: |
          df -hT $PWD
          git clone --depth 1 $REPO_URL

      - name: Building
        run: |
          chmod +x targets/armvirt64.sh
          ./targets/armvirt64.sh
          sudo timedatectl set-timezone "${TZ}"
          echo "BUILD_TAG=VincherWrt-$(cat openwrt-version.txt)-$(date +"%Y.%m.%d")" >> $GITHUB_ENV
          echo "PACKAGED_STATUS=success" >> $GITHUB_ENV
     
      - name: Repacking
        run: |
          chmod +x amlogic-openwrt/make
          cd amlogic-openwrt/ && sudo ./make -b $PROC_LISTS -k $KERNEL_VR -r $KERNEL_REPO -a false
 
      - name: Upload OpenWrt Firmware to Release
        uses: ncipollo/release-action@main
        if: ${{ env.PACKAGED_STATUS }} == 'success' && !cancelled()
        with:
          tag: ${{ env.BUILD_TAG }}
          artifacts: "amlogic-openwrt/openwrt/out/*.img.gz,amlogic-openwrt/openwrt-armvirt/*.tar.gz"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: release_body.txt